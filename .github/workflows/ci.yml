name: CI

on:
  push:
    branches: [main, develop]
  # Every PR, including stacked ones whose base is another feature branch.
  pull_request:

env:
  NODE_VERSION: 22
  PNPM_VERSION: 12
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: Linter / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      # Sprint 15 (F15.6): known-vulnerable production dependencies fail the build.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

  secrets:
    # Sprint 15 (F15.6): no credentials in the repository, including its history.
    name: Secrets / gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2             git /repo --redact --verbose --config /repo/.gitleaks.toml

  typecheck:
    name: Typecheck / typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

  build:
    name: Build / build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

  test:
    name: Test / test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raise
          POSTGRES_PASSWORD: raise
          POSTGRES_DB: raise
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U raise -d raise"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://raise:raise@localhost:5432/raise
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      OTP_MOCK_ENABLED: 'true'
      SMS_PROVIDER: mock
      NODE_ENV: test
      # Sprint 8: S3-compatible store for screenshot uploads (started in a step below,
      # because GitHub service containers cannot take a command).
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_AUTO_CREATE_BUCKET: 'true'
      R2_ACCESS_KEY_ID: raise
      R2_SECRET_ACCESS_KEY: raise-storage-secret
      R2_BUCKET: raise-proof-screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start S3-compatible storage
        run: |
          docker run -d --name raise-storage -p 9000:9000 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.85 \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            [ "$code" = "403" ] && echo "storage ready" && break
            sleep 2
          done

      - name: Run migrations
        run: pnpm --filter @raise/api db:migrate

      - name: Seed reference data
        run: pnpm --filter @raise/api db:seed

      - name: Run tests
        run: pnpm turbo run test

      # Sprint 15 (F15.7): back up the database the suite just filled, restore it into a
      # fresh database and verify the copy (rows, triggers, migrations, ledger invariants).
      - name: Backup and restore drill
        run: bash infra/restore-drill.sh
        env:
          SOURCE_DATABASE_URL: postgres://raise:raise@localhost:5432/raise

  perf:
    # Sprint 15 (F15.1). PRD: first load under 3 s on throttled 3G. Simulated "Regular 3G"
    # (300 ms RTT, 700 kbps) on a mobile viewport with 4x CPU slowdown, production build.
    # First contentful paint gates the build; LCP, blocking time and JS weight warn and
    # are recorded in the report until their budgets are set from real numbers.
    name: Perf / lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (production)
        run: pnpm turbo run build --filter=@raise/web...
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3201

      - name: Start web
        run: |
          pnpm --filter @raise/web exec next start -p 3200 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3200/ && echo "web ready" && break
            sleep 2
          done

      - name: Lighthouse (throttled 3G, mobile)
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          retention-days: 14

  load:
    # Sprint 15 (F15.2, F15.3). Smoke profiles of the load tests against the local stack,
    # so the scripts stay working and gross regressions fail the build. The PRD-scale runs
    # (500 VUs, 3,000 sockets) use the same scripts on staging.
    name: Load / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raise
          POSTGRES_PASSWORD: raise
          POSTGRES_DB: raise_load
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U raise -d raise_load"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://raise:raise@localhost:5432/raise_load
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      OTP_MOCK_ENABLED: 'true'
      SMS_PROVIDER: mock
      NODE_ENV: development
      WS_CONNECT_LIMIT_PER_MIN: '100000'
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_AUTO_CREATE_BUCKET: 'true'
      R2_ACCESS_KEY_ID: raise
      R2_SECRET_ACCESS_KEY: raise-storage-secret
      R2_BUCKET: raise-proof-screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start S3-compatible storage
        run: |
          docker run -d --name raise-storage -p 9000:9000             -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"             chrislusf/seaweedfs:3.85             server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            [ "$code" = "403" ] && echo "storage ready" && break
            sleep 2
          done

      - name: Build API
        run: pnpm turbo run build --filter=@raise/api...

      - name: Migrate, seed reference data and load players
        run: |
          # The release-step migrator production uses (dist/db/migrate.js), on a clean database.
          pnpm --filter @raise/api db:migrate:deploy
          pnpm --filter @raise/api db:seed
          pnpm --filter @raise/api exec tsx src/scripts/load-seed.ts 100 "$GITHUB_WORKSPACE/load-tokens.json"
          # Demo ladders (audit B27): small, so it proves the seed against the real schema.
          pnpm --filter @raise/api db:seed:demo 10 20

      - name: Start two API instances (shared Redis)
        run: |
          for port in 3301 3302; do
            (cd apps/api && PORT=$port node dist/main.js > /tmp/api-$port.log 2>&1 &)
          done
          for port in 3301 3302; do
            for i in $(seq 1 60); do
              curl -sf -o /dev/null http://localhost:$port/health && echo "api $port ready" && break
              sleep 2
            done
          done

      - name: API load smoke (k6, 50 VUs, p95 < 500 ms)
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/load" grafana/k6:0.54.0             run -e PROFILE=smoke -e TOKENS=/load/load-tokens.json -e API_URL=http://localhost:3301             /load/tests/load/api.k6.js

      - name: WebSocket fan-out smoke (200 sockets across 2 instances)
        run: |
          SOCKETS=200 ROUNDS=5 WS_URLS=http://localhost:3301,http://localhost:3302             pnpm --filter @raise/api exec tsx src/scripts/ws-load.ts "$GITHUB_WORKSPACE/load-tokens.json"

      # The running APIs' ratings consumer applied the demo matches; the log must replay to
      # exactly the stored ratings (PRD acceptance), and must not be empty.
      - name: Demo ladder ratings replay exactly
        run: |
          out=$(pnpm --filter @raise/api ratings:verify)
          echo "$out"
          echo "$out" | grep -qE 'rating events: [1-9]'

      - name: API logs on failure
        if: failure()
        run: tail -n 200 /tmp/api-3301.log /tmp/api-3302.log

  e2e:
    name: E2E / two-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raise
          POSTGRES_PASSWORD: raise
          POSTGRES_DB: raise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U raise -d raise_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://raise:raise@localhost:5432/raise_test
      E2E_DATABASE_URL: postgres://raise:raise@localhost:5432/raise_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      OTP_MOCK_ENABLED: 'true'
      SMS_PROVIDER: mock
      NODE_ENV: development
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_AUTO_CREATE_BUCKET: 'true'
      R2_ACCESS_KEY_ID: raise
      R2_SECRET_ACCESS_KEY: raise-storage-secret
      R2_BUCKET: raise-proof-screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start S3-compatible storage
        run: |
          docker run -d --name raise-storage -p 9000:9000             -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"             chrislusf/seaweedfs:3.85             server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json             -s3.allowedOrigins=http://localhost:3100
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            [ "$code" = "403" ] && echo "storage ready" && break
            sleep 2
          done

      - name: Build shared packages
        run: pnpm turbo run build --filter=./packages/*

      - name: Migrate and seed
        run: |
          pnpm --filter @raise/api db:migrate
          pnpm --filter @raise/api db:seed

      - name: Install Playwright browser
        run: pnpm --filter @raise/web exec playwright install --with-deps chromium

      - name: Run two-browser e2e suite
        run: pnpm --filter @raise/web test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Sprint 1 F1.7 / audit #4, B16: Storybook visual regression, a11y and behaviour specs on
  # Linux against the committed *-linux.png baselines. A new story fails until it has one:
  # run this job with `--update-snapshots=missing` once, review the uploaded PNGs, commit.
  visual:
    name: Visual / storybook
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build --filter=./packages/*

      - name: Build Storybook
        run: pnpm --filter @raise/web storybook:build

      - name: Install Playwright browser
        run: pnpm --filter @raise/web exec playwright install --with-deps chromium

      - name: Visual, a11y and behaviour specs
        run: pnpm --filter @raise/web test:visual

      - name: Upload snapshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-visual
          path: |
            apps/web/e2e/*-snapshots/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  docker-api:
    name: Docker API Build
    runs-on: ubuntu-latest
    needs: build
    # Audit B12: on main, the API image (identical for every environment) is published to
    # GitHub's container registry for the deploy step to pull.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: raise/api:${{ github.sha }}
          load: true

      # The image must start node, load the app and refuse to boot without its settings,
      # and must not run as root (audit B4/B5).
      - name: Smoke-run API image
        env:
          IMAGE: raise/api:${{ github.sha }}
        run: |
          set +e
          out=$(docker run --rm "$IMAGE" 2>&1)
          code=$?
          set -e
          echo "$out" | tail -5
          test "$code" -ne 0
          echo "$out" | grep -q 'Invalid environment configuration'
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"

      - name: Publish API image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: raise/api:${{ github.sha }}
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for tag in '${{ github.sha }}' main; do
            docker tag "$IMAGE" "$repo:$tag"
            docker push "$repo:$tag"
          done

  docker-web:
    name: Docker Web Build
    runs-on: ubuntu-latest
    needs: build
    # The web image compiles NEXT_PUBLIC_* in, so it is per environment. It is published on
    # main only once the staging values exist as repository variables (audit B12).
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_NEXT_PUBLIC_API_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: raise/web:${{ github.sha }}
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
            NEXT_PUBLIC_STORAGE_ORIGIN=${{ vars.STAGING_NEXT_PUBLIC_STORAGE_ORIGIN || 'http://localhost:9000' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
            WEB_BUILD_STRICT=${{ env.PUBLISH }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.STAGING_NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_RELEASE_SHA=${{ github.sha }}

      - name: Publish staging web image (main, once staging variables are set)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: raise/web:${{ github.sha }}
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/web"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for tag in '${{ github.sha }}-staging' staging; do
            docker tag "$IMAGE" "$repo:$tag"
            docker push "$repo:$tag"
          done

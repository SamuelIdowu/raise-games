services:
  postgres:
    image: postgres:17-alpine
    container_name: raise-pg
    environment:
      POSTGRES_USER: raise
      POSTGRES_PASSWORD: raise
      POSTGRES_DB: raise
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raise -d raise']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: raise-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (Sprint 8 result screenshots).
  # SeaweedFS verifies SigV4 signatures, so presigned-URL expiry and signing are exercised locally.
  # The API creates the private bucket on boot when STORAGE_AUTO_CREATE_BUCKET=true (dev/test only).
  storage:
    image: chrislusf/seaweedfs:3.85
    container_name: raise-storage
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=9000',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-s3.allowedOrigins=http://localhost:3000,http://localhost:3100',
      ]
    ports:
      - '9000:9000'
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  storagedata:
